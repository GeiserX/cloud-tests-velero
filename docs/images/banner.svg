<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2"/>
      <stop offset="100%" style="stop-color:#0D1B2A"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g stroke="white" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="40" x2="900" y2="40"/><line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="150" y1="0" x2="150" y2="200"/><line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/><line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>
  <!-- Cloud icon with backup/restore arrows -->
  <g transform="translate(100, 100)" fill="none" stroke="white" stroke-width="2.5" opacity="0.9">
    <!-- Cloud shape -->
    <path d="M-40,10 A25,25 0 0,1 -15,-15 A20,20 0 0,1 15,-20 A25,25 0 0,1 40,-5 A15,15 0 0,1 40,15 L-40,15 A15,15 0 0,1 -40,10Z" fill="white" fill-opacity="0.15"/>
    <path d="M-40,10 A25,25 0 0,1 -15,-15 A20,20 0 0,1 15,-20 A25,25 0 0,1 40,-5 A15,15 0 0,1 40,15 L-40,15 A15,15 0 0,1 -40,10Z"/>
    <!-- Circular arrows (backup/restore) -->
    <path d="M-12,25 A18,18 0 0,1 12,25" stroke-linecap="round"/>
    <path d="M12,45 A18,18 0 0,1 -12,45" stroke-linecap="round"/>
    <polygon points="12,22 12,28 18,25" fill="white"/>
    <polygon points="-12,48 -12,42 -18,45" fill="white"/>
  </g>
  <!-- Title -->
  <text x="450" y="85" text-anchor="middle" fill="white" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="bold">Velero Cloud Tests</text>
  <!-- Subtitle -->
  <text x="450" y="115" text-anchor="middle" fill="white" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" opacity="0.8">Disaster Recovery analysis for managed Kubernetes clusters</text>
  <!-- Decorative dots right -->
  <g fill="white" opacity="0.1">
    <circle cx="810" cy="40" r="3"/><circle cx="830" cy="40" r="3"/><circle cx="850" cy="40" r="3"/>
    <circle cx="810" cy="60" r="3"/><circle cx="830" cy="60" r="3"/><circle cx="850" cy="60" r="3"/>
    <circle cx="810" cy="80" r="3"/><circle cx="830" cy="80" r="3"/><circle cx="850" cy="80" r="3"/>
    <circle cx="810" cy="140" r="3"/><circle cx="830" cy="140" r="3"/><circle cx="850" cy="140" r="3"/>
    <circle cx="810" cy="160" r="3"/><circle cx="830" cy="160" r="3"/><circle cx="850" cy="160" r="3"/>
  </g>
</svg>
