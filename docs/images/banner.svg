<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="50%" stop-color="#0D2137"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g stroke="white" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>
  <!-- Cloud -->
  <g transform="translate(82, 96)" fill="white" fill-opacity="0.12" stroke="white" stroke-width="2" opacity="0.9">
    <path d="M -32,12 L -32,12
             A 18,18 0 0,1 -32,-6
             A 14,14 0 0,1 -18,-18
             A 22,22 0 0,1 4,-24
             A 24,24 0 0,1 28,-12
             A 16,16 0 0,1 38,0
             A 14,14 0 0,1 38,12
             Z"
          stroke-linejoin="round"/>
  </g>
  <!-- Shield with checkmark -->
  <g transform="translate(138, 96)">
    <!-- Shield body -->
    <path d="M 0,-28 L 20,-19 L 20,2 Q 20,22 0,30 Q -20,22 -20,2 L -20,-19 Z"
          fill="white" fill-opacity="0.12" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.9"/>
    <!-- Checkmark -->
    <polyline points="-7,2 -2,8 9,-4" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>
  <!-- Title -->
  <text x="530" y="82" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="bold" fill="white" text-anchor="middle">Velero Cloud Tests</text>
  <!-- Subtitle -->
  <text x="530" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="white" opacity="0.7" text-anchor="middle">Disaster Recovery analysis for managed Kubernetes clusters</text>
</svg>
