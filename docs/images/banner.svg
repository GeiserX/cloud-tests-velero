<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B46"/>
      <stop offset="40%" stop-color="#0A1E33"/>
      <stop offset="100%" stop-color="#060E1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="12%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#1E88E5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1E88E5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <!-- Soft blue glow on the left -->
  <rect width="900" height="200" rx="12" fill="url(#glow)"/>
  <!-- Abstract concentric arcs — analysis/scanning motif -->
  <g fill="none" stroke="white" stroke-linecap="round">
    <path d="M 110,100 m -52,0 a 52,52 0 0,1 52,-52" stroke-width="1" stroke-opacity="0.06"/>
    <path d="M 110,100 m -40,0 a 40,40 0 0,1 40,-40" stroke-width="1.2" stroke-opacity="0.09"/>
    <path d="M 110,100 m -28,0 a 28,28 0 0,1 28,-28" stroke-width="1.5" stroke-opacity="0.13"/>
    <path d="M 110,100 m -16,0 a 16,16 0 0,1 16,-16" stroke-width="1.8" stroke-opacity="0.18"/>
    <!-- Mirrored bottom-right arcs -->
    <path d="M 110,100 m 52,0 a 52,52 0 0,1 -52,52" stroke-width="1" stroke-opacity="0.06"/>
    <path d="M 110,100 m 40,0 a 40,40 0 0,1 -40,40" stroke-width="1.2" stroke-opacity="0.09"/>
    <path d="M 110,100 m 28,0 a 28,28 0 0,1 -28,28" stroke-width="1.5" stroke-opacity="0.13"/>
    <path d="M 110,100 m 16,0 a 16,16 0 0,1 -16,16" stroke-width="1.8" stroke-opacity="0.18"/>
    <!-- Center dot -->
    <circle cx="110" cy="100" r="2.5" fill="white" fill-opacity="0.25" stroke="none"/>
  </g>
  <!-- Title -->
  <text x="480" y="82" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.5">Velero Cloud Tests</text>
  <!-- Subtitle -->
  <text x="480" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="white" opacity="0.5" text-anchor="middle" letter-spacing="1">Disaster Recovery analysis for managed Kubernetes clusters</text>
</svg>
