<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="50%" stop-color="#0D2137"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <!-- Clip the cloud flat at the bottom -->
    <clipPath id="cloud-clip">
      <rect x="30" y="50" width="100" height="72"/>
    </clipPath>
  </defs>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g stroke="white" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>
  <!-- Cloud: composited circles + flat base (proper cloud technique) -->
  <g clip-path="url(#cloud-clip)">
    <g fill="white" fill-opacity="0.13" stroke="white" stroke-width="1.8" stroke-opacity="0.8">
      <rect x="48" y="104" width="64" height="20" rx="10"/>
      <circle cx="60" cy="100" r="18"/>
      <circle cx="80" cy="86" r="24"/>
      <circle cx="102" cy="96" r="18"/>
    </g>
  </g>
  <!-- Shield: to the right of cloud, vertically centered -->
  <g transform="translate(156, 97)">
    <path d="M 0,-28 L 22,-18 L 22,4 Q 22,22 0,30 Q -22,22 -22,4 L -22,-18 Z"
          fill="white" fill-opacity="0.13" stroke="white" stroke-width="1.8" stroke-opacity="0.8" stroke-linejoin="round"/>
    <polyline points="-8,2 -2,10 10,-6" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>
  <!-- Title -->
  <text x="540" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="bold" fill="white" text-anchor="middle">Velero Cloud Tests</text>
  <!-- Subtitle -->
  <text x="540" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="white" opacity="0.7" text-anchor="middle">Disaster Recovery analysis for managed Kubernetes clusters</text>
</svg>
