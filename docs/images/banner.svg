<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="50%" stop-color="#0D2137"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g stroke="white" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>
  <!-- Icon: shield with circular restore arrow -->
  <g transform="translate(108, 100)">
    <!-- Shield outline -->
    <path d="M 0,-40 L 30,-28 L 30,5 Q 30,30 0,42 Q -30,30 -30,5 L -30,-28 Z"
          fill="url(#shield)" fill-opacity="0.15" stroke="#42A5F5" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Circular arrow (DR restore) -->
    <path d="M -12,-12 A 16,16 0 1,1 10,-14" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    <polygon points="10,-18 10,-10 16,-14" fill="white" opacity="0.85"/>
    <!-- Checkmark inside -->
    <polyline points="-7,6 -2,12 9,0" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
  <!-- Title -->
  <text x="520" y="82" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="bold" fill="white" text-anchor="middle">Velero Cloud Tests</text>
  <!-- Subtitle -->
  <text x="520" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="white" opacity="0.7" text-anchor="middle">Disaster Recovery analysis for managed Kubernetes clusters</text>
  <!-- AWS + GCP pill labels -->
  <g transform="translate(520, 150)" text-anchor="middle">
    <rect x="-110" y="-12" width="52" height="22" rx="11" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="0.8"/>
    <text x="-84" y="4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="white" opacity="0.6">EKS</text>
    <rect x="-46" y="-12" width="52" height="22" rx="11" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="0.8"/>
    <text x="-20" y="4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="white" opacity="0.6">GKE</text>
    <rect x="18" y="-12" width="52" height="22" rx="11" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="0.8"/>
    <text x="44" y="4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="white" opacity="0.6">Velero</text>
    <rect x="82" y="-12" width="60" height="22" rx="11" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="0.8"/>
    <text x="112" y="4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="white" opacity="0.6">RTO/RPO</text>
  </g>
</svg>
